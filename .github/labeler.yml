# Rules for actions/labeler v7, in the format it has used since v5. A pull
# request gets a label when any file it changes matches any of that label's
# globs. Paths that start with a dot match too, so .github is covered.
# documentation already exists in this repository; the labeler creates the
# other four the first time it applies them.

generator:
  - changed-files:
      - any-glob-to-any-file:
          - coderprint.py
          - action.yml
          - tools/**
          - places.tsv.gz

relay:
  - changed-files:
      - any-glob-to-any-file:
          - api/**
          - lib/**
          - public/**
          - package.json

tests:
  - changed-files:
      - any-glob-to-any-file:
          - test/**

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'

workflows:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
