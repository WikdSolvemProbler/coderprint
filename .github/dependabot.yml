version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      routine-action-updates:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /test/fuzz
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      fuzz-tool-updates:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      snapshot-crypto-updates:
        patterns: [cryptography, cffi, pycparser]
        update-types: [minor, patch]
