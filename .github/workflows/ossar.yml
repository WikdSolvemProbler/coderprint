# The Open Source Static Analysis Runner (OSSAR) runs open source security
# tools, among them Bandit on Python and ESLint on JavaScript, and uploads what
# they find to code scanning. It runs only on Windows runners.
#
# github/ossar-action is not archived, but it is still marked beta and its last
# release, v2.0.0, dates from 18APR2024. The v1 this workflow first named is a
# branch, last changed 11MAR2022, that runs on Node.js 12, which GitHub Actions
# no longer ships, so it is pinned to v2.0.0 instead. CodeQL already covers
# the same two languages.
#
# Every action is pinned to a full commit hash with its version beside it, so a
# moved tag cannot change what runs.
name: OSSAR

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '29 6 * * 3'

permissions: {}

jobs:
  OSSAR-Scan:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # to upload the results to code scanning; this repository is public, so
      # actions: read is not needed
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Run OSSAR
      uses: github/ossar-action@4e96c4f6e591eb4b991abfd459e40b136a317aea # v2.0.0
      id: ossar

    # v4 rather than v3: GitHub deprecates CodeQL Action v3 in December 2026
    # (github/codeql-action CHANGELOG.md), and v4 is what codeql.yml runs
    - name: Upload OSSAR results
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        sarif_file: ${{ steps.ossar.outputs.sarifFile }}
