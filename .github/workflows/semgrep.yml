# Semgrep Community Edition scans shipped Python and JavaScript. Test fixtures
# contain deliberately hostile examples, so only production paths are scanned.
# Findings, scanner errors, and rule-download errors fail the job.
name: Semgrep CE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '41 5 * * 3'
  workflow_dispatch:

permissions: {}

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - name: Monitor runner activity
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Scan production source
      run: |
        container="semgrep-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-pr"
        trap 'timeout -k 5s 30s docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
        timeout -k 10s 600s docker run --name "$container" --rm --volume "$PWD:/src" --workdir /src \
          semgrep/semgrep:1.177.0@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198 \
          semgrep scan --config p/security-audit --metrics off --disable-version-check --strict --error --timeout 60 coderprint.py api lib

  main:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Monitor runner activity
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Scan production source
      run: |
        container="semgrep-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-main"
        trap 'timeout -k 5s 30s docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
        timeout -k 10s 600s docker run --name "$container" --rm --volume "$PWD:/src" --workdir /src \
          semgrep/semgrep:1.177.0@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198 \
          semgrep scan --config p/security-audit --metrics off --disable-version-check --strict --error --timeout 60 --sarif-output=semgrep.sarif coderprint.py api lib

    - name: Upload Semgrep results
      if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' }}
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        sarif_file: semgrep.sarif
        category: semgrep
