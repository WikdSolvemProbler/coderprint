# Dependency review checks what a pull request to main adds to the dependency
# graph and fails it if a new dependency has a known vulnerability. It compares
# the graph through GitHub and runs no code from the pull request.
#
# Every action is pinned to a full commit hash with its version beside it, so a
# moved tag cannot change what runs.
name: 'Dependency review'

on:
  pull_request:
    branches: [ "main" ]

permissions: {}

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # to post the summary as a comment on the pull request
      pull-requests: write
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # A pull request from a fork runs with a read-only token, which cannot
          # comment. The action would only log a warning, but it is never asked:
          # for a fork the summary goes to the job summary alone.
          comment-summary-in-pr: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'always' || 'never' }}
