# Everything that has to pass before a change lands: the regression suites, the
# relay fuzzers, and a syntax and security check of these workflows. Security analysis lives
# in codeql.yml and the pull request description check in contribution-check.yml.
#
# Every action is pinned to a full commit hash with its version beside it, so a
# moved tag cannot change what runs.
name: tests

on:
  push: {}
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Monitor runner activity
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Relay and contribution checks
        run: timeout -k 10s 300s npm test

      - name: Install authenticated snapshot dependencies
        run: |
          timeout -k 10s 120s python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-snapshot.txt

      - name: Generator regression checks
        run: timeout -k 10s 1800s python test/py/run.py

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Monitor runner activity
        timeout-minutes: 2
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out source
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        timeout-minutes: 2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/fuzz/package-lock.json

      - name: Install locked fuzzer dependencies
        timeout-minutes: 3
        run: timeout -k 10s 180s npm ci --prefix test/fuzz --ignore-scripts --no-audit --no-fund

      - name: Run shrinkable input properties
        timeout-minutes: 2
        run: timeout -k 10s 90s node --test test/fuzz/properties.test.js

      - name: Audit fuzzer dependencies
        timeout-minutes: 2
        run: timeout -k 10s 90s npm audit --prefix test/fuzz --audit-level=low

      - name: Replay checked-in regressions and fuzz SVG and JSON inputs
        timeout-minutes: 4
        shell: bash
        run: |
          timeout -k 10s 210s bash -euo pipefail <<'SH'
          cd test/fuzz
          mkdir -p "$RUNNER_TEMP/fuzz-svg" "$RUNNER_TEMP/fuzz-cards"
          cp corpus/svg/* "$RUNNER_TEMP/fuzz-svg/"
          cp corpus/cards/* "$RUNNER_TEMP/fuzz-cards/"
          timeout -k 5s 30s ./node_modules/.bin/jazzer ./svg.mjs --mode=regression --sync "$RUNNER_TEMP/fuzz-svg"
          timeout -k 5s 30s ./node_modules/.bin/jazzer ./cards.mjs --mode=regression --sync "$RUNNER_TEMP/fuzz-cards"
          timeout -k 5s 80s ./node_modules/.bin/jazzer ./svg.mjs --sync "$RUNNER_TEMP/fuzz-svg" -- -max_total_time=60 -max_len=4096 -timeout=2
          timeout -k 5s 80s ./node_modules/.bin/jazzer ./cards.mjs --sync "$RUNNER_TEMP/fuzz-cards" -- -max_total_time=60 -max_len=4096 -timeout=2
          SH

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Monitor runner activity
        timeout-minutes: 2
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out source
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check workflow syntax with actionlint
        timeout-minutes: 5
        shell: bash
        run: |
          timeout -k 10s 180s bash -euo pipefail <<'SH'
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --retry 2 --max-time 60 \
            --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
          SH

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Monitor runner activity
        timeout-minutes: 2
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out source
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows with zizmor
        timeout-minutes: 5
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: v1.30.1
          # Plain mode fails on findings for every PR; SARIF mode is report-only.
          # Branch pushes and manual runs keep the Security tab up to date.
          advanced-security: ${{ github.event_name != 'pull_request' }}
