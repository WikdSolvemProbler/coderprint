# Separate PR and trusted-branch triggers so each run has only applicable jobs.
# Preserve the required pull-request check and its read-only scan permissions.
name: Semgrep CE pull requests

on:
  pull_request:
    branches: [ main ]

permissions: {}

jobs:
  pull-request:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - name: Monitor runner activity
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Scan production source
      run: |
        container="semgrep-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-pr"
        trap 'timeout -k 5s 30s docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
        timeout -k 10s 600s docker run --name "$container" --rm --volume "$PWD:/src" --workdir /src \
          semgrep/semgrep:1.177.0@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198 \
          semgrep scan --config p/security-audit --metrics off --disable-version-check --strict --error --timeout 60 coderprint.py api lib
