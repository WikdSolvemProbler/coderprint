name: coderprint
description: New lines written, commit activity and the language mix over time, across public and private repositories, drawn for your profile README.
author: WikdSolvemProbler
branding:
  icon: activity
  color: orange

inputs:
  token:
    description: A token that can read every repository to count, ideally from your own read-only GitHub App (see the README).
    required: true
  owner:
    description: The account to draw for. It must be the account this repository belongs to; coderprint draws a card only for its own owner.
    default: ${{ github.repository_owner }}
  window:
    description: The span the panel covers, one of all, 10y, 5y, 3y, 2y, 12m.
    default: all
  theme:
    description: Pins one theme, one of paper, sepia, sage, oxblood, ink, drawn in its version for light mode and its version for dark. Optional; left empty, the five take turns, one a day.
    default: ""
  spotify-uid:
    description: Your id from the Spotify widget (spotify-github-profile.kittinanx.com), to show what you are playing beside the panel. Optional; set this or apple-music-uid, not both.
    default: ""
  apple-music-uid:
    description: Your uid from the Apple Music card (music-profile.rayriffy.com), to show the track you last played beside the panel. Optional; set this or spotify-uid, not both.
    default: ""
  relay:
    description: The address of your deployed relay's card endpoint (https://<your-deployment>/api/card), which merges the panel and the music card into one image. Optional.
    default: ""
  mark:
    description: Your watermark as SVG path data with straight segments only (M, L, H, V, Z), filled even-odd, up to 48 KB. Pass it from a secret (a repository secret named CODERPRINT_MARK, for example) so the path data never sits in your repository. It is drawn into the panel as pixels merged with the background; like any picture, what is drawn can still be seen and traced. Optional.
    default: ""
  author-emails:
    description: Email addresses you commit from that are not linked to your GitHub account, separated by commas, spaces or new lines, each bare or as Name <address>, so their commits count as yours. An address GitHub links to another account is ignored. Optional; addresses linked to your account, and your noreply addresses, are recognized already.
    default: ""
  time-limit:
    description: Seconds the drawing step may run, 300 to 86400. Keep it under the job's timeout-minutes; a repository that cannot be read in time is left out and counted.
    default: "1100"
  force:
    description: Redraw even if fewer repositories are visible than last time (a deleted repository, or a token that lost access).
    default: "false"
  commit:
    description: Commit and push the panel and README when they change.
    default: "true"

runs:
  using: composite
  steps:
    - name: Draw the panel
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        CARDS_OWNER: ${{ inputs.owner }}
        CARDS_WINDOW: ${{ inputs.window }}
        CARDS_THEME: ${{ inputs.theme }}
        CARDS_SPOTIFY_UID: ${{ inputs.spotify-uid }}
        CARDS_APPLE_MUSIC_UID: ${{ inputs.apple-music-uid }}
        CARDS_RELAY: ${{ inputs.relay }}
        CARDS_MARK_DATA: ${{ inputs.mark }}
        CARDS_AUTHOR_EMAILS: ${{ inputs.author-emails }}
        CARDS_TIME_LIMIT: ${{ inputs.time-limit }}
        FORCE: ${{ inputs.force == 'true' && '1' || '' }}
        COMMIT: ${{ inputs.commit }}
      run: |
        case "$CARDS_TIME_LIMIT" in
          ''|*[!0-9]*) echo "::error::time-limit must be a whole number of seconds"; exit 1 ;;
        esac
        if [ "$COMMIT" = true ]; then
          branch=$(git symbolic-ref -q --short HEAD) || { echo "::error::coderprint must run on a branch, not a tag"; exit 1; }
          # draw on the newest commit, so anything pushed since the run was queued is drawn around
          timeout 60 git pull -q --ff-only origin "$branch"
        fi
        timeout -k 30 "$CARDS_TIME_LIMIT" python3 "$GITHUB_ACTION_PATH/coderprint.py"

    - name: Commit the panel if it changed
      if: ${{ inputs.commit == 'true' }}
      shell: bash
      run: |
        branch=$(git symbolic-ref -q --short HEAD) || { echo "::error::coderprint must run on a branch, not a tag"; exit 1; }
        git add assets README.md
        if git diff --cached --quiet; then echo "no change"; exit 0; fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -q -m "Refresh profile panel"
        # if someone pushed while this run was drawing, stop rather than overwrite them; tomorrow redraws
        if ! timeout 60 git pull -q --rebase origin "$branch"; then
          git rebase --abort 2>/dev/null
          echo "::error::The branch changed while the panel was being drawn, so nothing was pushed. The next run redraws it."
          exit 1
        fi
        timeout 120 git push -q origin "HEAD:refs/heads/$branch"
