name: coderprint
description: New lines written, commit activity and the language mix over time, across public and private repositories, drawn for your profile README.
author: WikdSolvemProbler
branding:
  icon: activity
  color: orange

inputs:
  token:
    description: A token that can read every repository to count, ideally from your own read-only GitHub App (see the README).
    required: true
  owner:
    description: The account to draw for. It must be the account this repository belongs to; coderprint draws a card only for its own owner.
    default: ${{ github.repository_owner }}
  organizations:
    description: Organization logins whose repositories should be scanned for your own contributions, separated by commas or spaces. Optional.
    default: ""
  organization-only:
    description: Count only your own contributions in the configured organizations, excluding personally owned repositories.
    default: "false"
  organization-tokens:
    description: A JSON object mapping each configured organization to its read-only installation token. Pass token outputs or a secret; never put tokens in workflow text.
    default: ""
  authored-imports:
    description: Exact owner/repository@full-commit-hash uploads you declare as your existing authored work. Overrides the bulk-import heuristic for those commits after author and file exclusions. Optional; use a secret for private repository names.
    default: ""
  organization-snapshot:
    description: Path to an authenticated encrypted organization history snapshot downloaded from your private personal snapshot store. Optional; organizations are refreshed locally.
    default: ""
  organization-snapshot-key:
    description: Base64 snapshot decryption key from a secret. Never put the key in workflow text.
    default: ""
  snapshot-store:
    description: Personal owner/repository holding encrypted snapshots; excluded from contributions. Use a secret for its private name.
    default: ""
  window:
    description: The span the panel covers, one of all, 10y, 5y, 3y, 2y, 12m.
    default: all
  theme:
    description: Pins one theme, one of paper, sepia, sage, oxblood, ink, drawn in its version for light mode and its version for dark. Optional; left empty, the five take turns, one a day.
    default: ""
  spotify-uid:
    description: Your id from the Spotify widget (spotify-github-profile.kittinanx.com), to show what you are playing beside the panel. Optional; set this or apple-music-uid, not both.
    default: ""
  apple-music-uid:
    description: Your uid from the Apple Music card (music-profile.rayriffy.com), to show the track you last played beside the panel. Optional; set this or spotify-uid, not both.
    default: ""
  relay:
    description: The address of your deployed relay's card endpoint (https://<your-deployment>/api/card), which merges the panel and the music card into one image. Optional.
    default: ""
  mark:
    description: Your watermark as SVG path data with straight segments only (M, L, H, V, Z), filled even-odd, up to 48 KB. Pass it from a secret (a repository secret named CODERPRINT_MARK, for example) so the path data never sits in your repository. It is drawn into the panel as pixels merged with the background; like any picture, what is drawn can still be seen and traced. Optional.
    default: ""
  author-emails:
    description: Email addresses you commit from that are not linked to your GitHub account, separated by commas, spaces or new lines, each bare or as Name <address>, so their commits count as yours. An address GitHub links to another account is ignored. Optional; addresses linked to your account, and your noreply addresses, are recognized already.
    default: ""
  time-limit:
    description: Seconds the drawing step may run, 300 to 86400. Keep it under the job's timeout-minutes; a repository that cannot be read in time is left out and counted.
    default: "1100"
  force:
    description: Redraw even if fewer repositories are visible than last time (a deleted repository, or a token that lost access).
    default: "false"
  commit:
    description: Commit and push the panel and README when they change.
    default: "true"

runs:
  using: composite
  steps:
    - name: Draw the panel
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        CARDS_OWNER: ${{ inputs.owner }}
        CARDS_ORGANIZATIONS: ${{ inputs.organizations }}
        CARDS_ORGANIZATION_ONLY: ${{ inputs.organization-only }}
        CARDS_ORGANIZATION_TOKENS: ${{ inputs.organization-tokens }}
        CARDS_AUTHORED_IMPORTS: ${{ inputs.authored-imports }}
        CARDS_ORGANIZATION_SNAPSHOT: ${{ inputs.organization-snapshot }}
        CARDS_ORGANIZATION_SNAPSHOT_KEY: ${{ inputs.organization-snapshot-key }}
        CARDS_SNAPSHOT_STORE: ${{ inputs.snapshot-store }}
        CARDS_WINDOW: ${{ inputs.window }}
        CARDS_THEME: ${{ inputs.theme }}
        CARDS_SPOTIFY_UID: ${{ inputs.spotify-uid }}
        CARDS_APPLE_MUSIC_UID: ${{ inputs.apple-music-uid }}
        CARDS_RELAY: ${{ inputs.relay }}
        CARDS_MARK_DATA: ${{ inputs.mark }}
        CARDS_AUTHOR_EMAILS: ${{ inputs.author-emails }}
        CARDS_TIME_LIMIT: ${{ inputs.time-limit }}
        FORCE: ${{ inputs.force == 'true' && '1' || '' }}
        COMMIT: ${{ inputs.commit }}
      run: |
        case "$CARDS_TIME_LIMIT" in
          ''|*[!0-9]*) echo "::error::time-limit must be a whole number of seconds"; exit 1 ;;
        esac
        if [ -n "$CARDS_ORGANIZATION_SNAPSHOT" ] || [ -n "$CARDS_SNAPSHOT_STORE" ]; then
          deps=$(mktemp -d "$RUNNER_TEMP/coderprint-crypto.XXXXXX")
          trap 'rm -rf -- "$deps"' EXIT
          timeout -k 10 120 env -u GH_TOKEN -u GITHUB_TOKEN -u GH_ENTERPRISE_TOKEN -u GITHUB_ENTERPRISE_TOKEN \
            -u CARDS_ORGANIZATION_TOKENS -u CARDS_ORGANIZATION_SNAPSHOT_KEY -u CARDS_SNAPSHOT_STORE \
            -u CARDS_ORGANIZATION_SNAPSHOT -u CARDS_AUTHORED_IMPORTS -u CARDS_AUTHOR_EMAILS \
            python3 -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes \
            --target "$deps" -r "$GITHUB_ACTION_PATH/requirements-snapshot.txt"
          export PYTHONPATH="$deps${PYTHONPATH:+:$PYTHONPATH}"
        fi
        if [ "$COMMIT" = true ]; then
          branch=$(git symbolic-ref -q --short HEAD) || { echo "::error::coderprint must run on a branch, not a tag"; exit 1; }
          # draw on the newest commit, so anything pushed since the run was queued is drawn around
          timeout 60 git pull -q --ff-only origin "$branch"
        fi
        timeout -k 30 "$CARDS_TIME_LIMIT" python3 "$GITHUB_ACTION_PATH/coderprint.py"

    - name: Commit the panel if it changed
      if: ${{ inputs.commit == 'true' }}
      shell: bash
      run: |
        branch=$(git symbolic-ref -q --short HEAD) || { echo "::error::coderprint must run on a branch, not a tag"; exit 1; }
        # an organization's profile README is its .github repository's profile/README.md
        repo=$(printf '%s' "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')
        if [ "$repo" = .github ]; then readme=profile/README.md; else readme=README.md; fi
        # exactly the files coderprint writes, past any .gitignore rule that would drop them silently (*.svg) or
        # fail the step (assets/), and the old cards.json only as far as it is tracked (coderprint removes its own
        # and writes none); nothing else, such as a temporary file
        files=()
        for f in "$readme" assets/panel-light.svg assets/panel-dark.svg assets/panel-compact-light.svg \
                 assets/panel-compact-dark.svg assets/blank.svg assets/coderprint.json; do
          if [ -f "$f" ] || git ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then files+=("$f"); fi
        done
        if git ls-files --error-unmatch -- assets/cards.json >/dev/null 2>&1; then files+=(assets/cards.json); fi
        git add --force -- "${files[@]}"
        if git diff --cached --quiet; then echo "no change"; exit 0; fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -q -m "Refresh profile panel"
        # if someone pushed while this run was drawing, stop rather than overwrite them; tomorrow redraws
        if ! timeout 60 git pull -q --rebase origin "$branch"; then
          git rebase --abort 2>/dev/null
          echo "::error::The branch changed while the panel was being drawn, so nothing was pushed. The next run redraws it."
          exit 1
        fi
        timeout 120 git push -q origin "HEAD:refs/heads/$branch"
